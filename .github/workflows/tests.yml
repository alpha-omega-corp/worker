name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # The base (alpha-omega-corp/site) and the kit (alpha-omega-corp/laravel)
    # are private repositories: the secret is {"github-oauth": {"github.com":
    # "<token>"}}, a fine-grained token with read-only Contents on those two.
    # Set once on the alpha-omega-corp organisation for every repository, for
    # Actions and again for Dependabot, whose pull requests do not get Actions
    # secrets: gh secret set COMPOSER_AUTH --org alpha-omega-corp --visibility all
    # --app actions (then --app dependabot). Not per site.
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

    steps:
      - name: Check the base can be installed
        if: env.COMPOSER_AUTH == ''
        run: |
          echo "::error::The COMPOSER_AUTH secret is not set, so composer cannot install alpha-omega-corp/site. Set it on the alpha-omega-corp organisation, for Actions and for Dependabot (see the comment above COMPOSER_AUTH in .github/workflows/tests.yml)."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
