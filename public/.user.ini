; php-fpm reads this file for every script under public/, so a site raises its
; own limits with nothing changed on the host. PHP's defaults (2M for a file,
; 8M for a request) refuse a photo from a phone before Laravel sees it; the
; media library of alpha-omega-corp/site takes images up to 16 MB, and a
; request carries the form around the file, hence the margin.
upload_max_filesize = 16M
post_max_size = 18M
